{% extends "base.html" %}
{% block content %}
<header class="page-head"><h1>{{ title }}</h1></header>
<div class="card">
<p role="alert">{{ message }}</p>
<ul class="actions stacked">
{% for (label, url) in links %}
  <li><a class="button{% if loop.first %} primary{% endif %}" href="{{ url }}">{{ label }}</a></li>
{% endfor %}
</ul>
</div>
{% endblock %}
