<div class="group float-group">
  <div class="float-field">
    <input id="current" name="current" placeholder=" " type="password" required autocomplete="current-password" {% if errors.has("current") %}aria-invalid="true" aria-describedby="current-error"{% endif %}>
    <label for="current">{{ lang.t("Current password") }}</label>
    {% if let Some(e) = errors.get("current") %}<p class="field-error" id="current-error">{{ e }}</p>{% endif %}
  </div>
</div>
