{% extends "base.html" %}
{% block content %}
<header class="welcome">
  <span class="app-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 21V3c-2.2 1.2-3.5 3.8-3.5 7v3H17"/></svg></span>
  <h1>{{ lang.t("Welcome to Korpus") }}</h1>
  <p>{{ lang.t("Korpus is a private food diary that runs on your own server. A few quick settings, then you can start logging.") }}</p>
</header>
{% include "_errors.html" %}
<form method="post" action="/setup">
  <div class="card">
  {% include "_profile_fields.html" %}
  </div>
  <button type="submit" class="primary block">{{ lang.t("Continue") }}</button>
</form>
{% endblock %}
