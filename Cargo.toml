[package]
name = "korpus"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A small, self-hostable calorie and macronutrient tracker"

[dependencies]
askama = "0.16.1"
axum = { version = "0.8.9", features = ["multipart"] }
jiff = { version = "0.2.38", features = ["tzdb-bundle-always"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header", "limit", "trace", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
